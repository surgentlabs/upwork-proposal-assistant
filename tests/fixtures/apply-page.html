<!DOCTYPE html>
<html><head><title>Submit a Proposal - Upwork</title></head>
<body>
<main>
<h1>Submit a proposal</h1>
<form>
<section>
<h2>Terms</h2>
<label for="rate">Hourly Rate</label>
<input id="rate" type="text" value="40.00">
<label for="receive">You'll Receive</label>
<input id="receive" type="text" value="36.00">
</section>
<section>
<h2>Additional details</h2>
<label for="cover">Cover Letter</label>
<textarea id="cover"></textarea>
<div>
<div>Have you worked with WooCommerce Table Rate Shipping before?</div>
<div><textarea name="q1"></textarea></div>
</div>
<div>
<div>How soon could you start?</div>
<div><textarea name="q2">I typed this myself</textarea></div>
</div>
<div style="display:none"><textarea name="hidden"></textarea></div>
<input type="file" aria-label="Attachments">
</section>
<button type="submit">Send for 12 Connects</button>
</form>
<div>
This proposal requires 12 Connects
</div>
</main>
</body></html>
